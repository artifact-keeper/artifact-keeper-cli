# E2E test stack for artifact-keeper-cli.
# Ports are offset from the local dev stack to avoid conflicts.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: artifact_registry_test
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
    ports:
      - "30433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d artifact_registry_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    image: ghcr.io/artifact-keeper/artifact-keeper-backend:${API_VERSION:?set by tests/start-backend.sh}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://registry:registry@postgres:5432/artifact_registry_test"
      ADMIN_PASSWORD: "TestRunner!2026secure"
      JWT_SECRET: "${JWT_SECRET:?set by tests/start-backend.sh}"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 3s
      timeout: 5s
      retries: 30
