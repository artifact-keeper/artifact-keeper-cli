[workspace]
members = ["sdk", "xtask"]

[package]
name = "artifact-keeper-cli"
version = "1.11.0"
edition = "2024"
description = "CLI/TUI tool for Artifact Keeper — an enterprise artifact registry"
license = "MIT"
repository = "https://github.com/artifact-keeper/artifact-keeper-cli"
homepage = "https://artifactkeeper.com"
keywords = ["artifact", "registry", "cli", "package-manager"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88.0"

[[bin]]
name = "ak"
path = "src/main.rs"

[dependencies]
# Generated SDK
artifact-keeper-sdk = { path = "sdk" }

# CLI framework
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (must match progenitor-client's reqwest version)
reqwest = { version = "0.13", features = ["json", "stream", "multipart", "form"] }

# MIME detection for artifact uploads (extension-based, like Python's mimetypes)
mime_guess = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
toml_edit = "0.25"
serde_yaml = "0.9"

# Interactive prompts & terminal
cliclack = "0.3"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
indicatif = "0.17"
console = "0.15"
comfy-table = "8"

# Error handling
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

# Credential storage
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }

# Encoding
base64 = "0.23"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Cryptography
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
hex = "0.4"

# Reading package archives
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Utilities
dirs = "6"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
glob = "0.3"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3"
semver = "1"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["yaml"] }
predicates = "3"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde_json = "1"
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
