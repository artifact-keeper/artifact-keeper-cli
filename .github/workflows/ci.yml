name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "CLAUDE.md"
      - "LICENSE"
  # No paths-ignore here. Branch protection requires jobs from this workflow, and
  # a PR that a path filter skips never reports them, so it stays blocked forever.
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  # Keep in step with rust-version in Cargo.toml.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  # The committed SDK must be what xtask generates from the pinned API version,
  # and the pin, the spec and the SDK crate version must agree (xtask checks
  # both). xtask reads the spec from a sibling checkout. Same toolchain as the
  # Format job, because the generated file goes through rustfmt.
  sdk-drift:
    name: SDK Drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: artifact-keeper-cli
      - name: Read the API pin
        id: pin
        run: echo "version=$(tr -d '[:space:]' < artifact-keeper-cli/API_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: artifact-keeper/artifact-keeper-api
          ref: v${{ steps.pin.outputs.version }}
          path: artifact-keeper-api
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: artifact-keeper-cli
      - name: Check the generated SDK
        working-directory: artifact-keeper-cli
        run: cargo run -p xtask -- generate --check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  # Fails on any RUSTSEC advisory affecting Cargo.lock (vulnerabilities only;
  # informational warnings such as unmaintained/unsound do not fail the job).
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Fork and Dependabot PRs get no secrets, so there is no token to scan with.
  # A job-level `if` can't read secrets, so the guard is on each step: without
  # a token the job still runs and passes. That way the check reports a result
  # on every PR and can be required.
  #
  # A green SonarCloud check proves only that the scan ran (or was skipped), not
  # that the quality gate passed: sonar.qualitygate.wait isn't set, so the job
  # doesn't wait for the gate's result.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip scan when SONAR_TOKEN is unavailable
        if: env.SONAR_TOKEN == ''
        run: echo "::notice title=SonarCloud::SONAR_TOKEN is not available to this run (fork or Dependabot PR), so the scan was skipped."
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

  # Cross-platform build smoke test. The Linux legs build the static musl
  # targets that release.yml ships, on the same runners, so a dependency that
  # breaks static linking (e.g. one that links a system library) fails here
  # instead of at release (#178).
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.target
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          target="${{ matrix.target }}"
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Build (host)
        if: ${{ !matrix.target }}
        run: cargo build --release
      - name: Build (static musl)
        if: matrix.target
        run: |
          cargo build --release --target ${{ matrix.target }}
          .github/scripts/check-static-binary.sh target/${{ matrix.target }}/release/ak
          docker run --rm -v "$PWD/target/${{ matrix.target }}/release:/w:ro" alpine:3.22 /w/ak --version

  # Builds the Dockerfile and runs the binary in its runtime stage. A passing
  # `docker build` proves nothing about the image: a builder with a newer glibc
  # than the runtime stage builds fine and then can't start (#189).
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ak:ci .
      - run: docker run --rm ak:ci --version

  # "E2E Tests" is a required check, so the pinned leg keeps that exact name. The
  # other two are the rest of the support policy and aren't required. A newer
  # backend can break the CLI with no change here, so a red `latest` leg doesn't
  # fail the run. e2e-nightly.yml runs the same legs and files an issue.
  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [check]
    continue-on-error: ${{ matrix.leg == 'latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: E2E Tests
            leg: pinned
          - name: E2E (latest)
            leg: latest
          - name: E2E (previous minor)
            leg: previous-minor
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: artifact_registry_test
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
        ports:
          - 30433:5432
        options: >-
          --health-cmd "pg_isready -U registry -d artifact_registry_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the backend version
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(.github/scripts/e2e-backend-version.sh "${{ matrix.leg }}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          pinned="$(tr -d '[:space:]' < API_VERSION)"
          # While the pin is the newest release, the latest leg repeats the pinned one.
          if [ "${{ matrix.leg }}" = latest ] && [ "$version" = "$pinned" ]; then
            echo "::notice title=${{ matrix.name }}::The latest backend is the pinned $pinned, so this leg has nothing to add."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.backend.outputs.skip != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.backend.outputs.skip != 'true'
      - name: Start backend
        if: steps.backend.outputs.skip != 'true'
        run: .github/scripts/e2e-start-backend.sh "${{ steps.backend.outputs.version }}" "${{ job.services.postgres.network }}"
      - name: Run E2E tests
        if: steps.backend.outputs.skip != 'true'
        env:
          E2E_BACKEND_URL: http://localhost:8081
        run: cargo test --no-fail-fast --test 'e2e_*' -- --include-ignored --test-threads=1
      - name: Backend logs (on failure)
        if: failure() && steps.backend.outputs.skip != 'true'
        run: docker logs e2e-backend
