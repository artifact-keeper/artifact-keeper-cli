name: Bug Report
description: Report a bug or unexpected behavior in the Artifact Keeper CLI
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Before filing, please make sure you're in the right place:

        - For backend or API bugs, file in [artifact-keeper](https://github.com/artifact-keeper/artifact-keeper/issues/new).
        - For web UI bugs, file in [artifact-keeper-web](https://github.com/artifact-keeper/artifact-keeper-web/issues/new).
        - If you're unsure where the issue belongs, file it here and we'll move it to the right repo.
        - For security vulnerabilities, please use [private security reporting](https://github.com/artifact-keeper/artifact-keeper-cli/security/advisories/new) instead of a public issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear summary of the bug.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Tell us about the system where you encountered this bug.
      value: |
        - Operating System: <!-- e.g., Ubuntu 24.04, macOS 15.3, Windows 11 -->
        - Architecture: <!-- e.g., amd64, arm64 -->
        - Shell: <!-- e.g., bash, zsh, fish, PowerShell -->
        - Terminal emulator: <!-- e.g., iTerm2, Windows Terminal, Alacritty, GNOME Terminal -->
        - Installation method: <!-- e.g., cargo install, Homebrew, Snap, binary download -->
    validations:
      required: true

  - type: input
    id: cli-version
    attributes:
      label: CLI Version
      placeholder: "Output of `ak --version`"
    validations:
      required: true

  - type: input
    id: backend-version
    attributes:
      label: Backend Version
      description: The version of the Artifact Keeper backend you are connecting to, if applicable.
      placeholder: "e.g., 1.1.0, latest, N/A"
    validations:
      required: false

  - type: input
    id: command
    attributes:
      label: Command / Subcommand
      description: The CLI command or subcommand involved, if applicable.
      placeholder: "e.g., ak push, ak search, ak config"
    validations:
      required: false

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: observed-behavior
    attributes:
      label: Observed Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run `ak config set registry https://example.com`
        2. Run `ak push --repo my-repo ./package.tar.gz`
        3. Observe the error output
    validations:
      required: true

  - type: textarea
    id: debug-output
    attributes:
      label: Debug Output
      description: |
        Paste any relevant logs or terminal output here.
        Tip: Run the command with `RUST_LOG=debug` and `RUST_BACKTRACE=1` for detailed output.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or information that might help.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched the [existing issues](https://github.com/artifact-keeper/artifact-keeper-cli/issues) and this has not been reported before.
          required: true
        - label: I have redacted any sensitive information (tokens, passwords, private URLs) from the output above.
          required: true
        - label: I am using a currently supported version of the CLI.
          required: true
