name: Documentation Issue
description: Report an issue with documentation or suggest improvements
labels: ["documentation", "needs-triage"]
body:
  - type: dropdown
    id: documentation-type
    attributes:
      label: Documentation Type
      description: What kind of documentation issue is this?
      options:
        - Missing documentation
        - Incorrect or outdated information
        - Unclear or confusing content
        - Typo or formatting issue
        - Missing examples
        - CLI help text
        - Man page
        - Other
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location
      description: Where is the documentation issue? Include a URL, file path, or command (e.g., `ak help push`).
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue with the current documentation.
    validations:
      required: true

  - type: textarea
    id: suggested-improvement
    attributes:
      label: Suggested Improvement
      description: How should the documentation be changed or improved?
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context or references that might help.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched the [existing issues](https://github.com/artifact-keeper/artifact-keeper-cli/issues) to confirm this has not been reported before.
          required: true
